domain: Governance
schema_reference: governance/verification_frameworks/
version: 1.0.0
operational_status: active

# 1. Mandatory Entities
required_entities:
  - AuditLog:
      required_attributes: [audit_id, timestamp, artifact_ref, validation_status]
  - VerificationCheck:
      required_attributes: [check_id, rule_reference, result_hash]
  - DriftEvent:
      required_attributes: [event_id, source_artifact, detected_delta, severity]

# 2. Governance Workflow Requirements
required_governance_sections:
  - Integrity Audit Results:
      content_rule: "Summary of all active validation checks and failures."
  - Resolution Log:
      content_rule: "Detailed steps taken to resolve detected Document Drift."
  - Schema Versioning:
      content_rule: "Mapping of current artifact versions to Schema Hashes."

# 3. Validation Constraints
sync_constraints:
  all_drift_events_must_be_resolved_before_hardening: true
  audit_logs_must_be_immutable: true
  schema_hashes_must_match_git_head: true

# 4. Drift Detection Metadata
drift_rules:
  auto_rehardening_trigger: any_contract_change
  dependency_depth: 5
  verification_requirement: system_architect_signoff
